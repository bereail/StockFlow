target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[lint]
select = ["E", "F"]
# E501 (línea larga) queda fuera de forma global: son ~30 líneas repartidas
# en dicts de widgets de formularios y f-strings de reportes HTML, deuda de
# estilo aceptada a propósito (tocarlas a mano no vale el riesgo) — así el
# check de CI (OPS-005) sí puede ser bloqueante sin fallar por esto.
ignore = ["E501"]

[lint.per-file-ignores]
# views/__init__.py es un barrel: re-exporta todo con `import *` a propósito
# para que el resto de la app use `views.x_view` sin conocer el submódulo
# interno. forms/__init__.py ya no cumple ese rol (ARQ-01): el 94% del
# código ya importaba directo del submódulo, así que se vació el barrel y
# se migró el único import que quedaba.
"inventario/views/__init__.py" = ["F401", "F403"]
# desktop_app.py necesita fijar la variable de entorno PYWEBVIEW_GUI antes
# de importar webview — el import fuera del top del archivo es a propósito.
"desktop_app.py" = ["E402"]
