{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Iniciar sesión — StockFlow</title>
  {% now "U" as cachebust %}
  <link rel="stylesheet" href="{% static 'inventario/ui.css' %}?v={{ cachebust }}">
</head>
<body class="app login-page">

  <div class="login-bg-glow login-glow-1"></div>
  <div class="login-bg-glow login-glow-2"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <div class="login-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h12v3H6V3zm-1 5h14a2 2 0 0 1 2 2v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-6a2 2 0 0 1 2-2zm1 2v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6H6z"/>
          </svg>
        </div>
      </div>

      <h1 class="login-title">StockFlow</h1>
      <p class="login-subtitle">Ingresá tus credenciales para continuar</p>

      {% if error %}
      <div class="login-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;flex-shrink:0;">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Usuario o contraseña incorrectos.
      </div>
      {% endif %}

      <form method="post" class="login-form">
        {% csrf_token %}

        <div class="login-field">
          <label class="login-label">Usuario</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" name="username" autofocus autocomplete="username" placeholder="nombre de usuario">
          </div>
        </div>

        <div class="login-field">
          <label class="login-label">Contraseña</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" name="password" id="password-input" autocomplete="current-password" placeholder="••••••••">
            <button type="button" class="login-show-pass" id="toggle-pass" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <!-- RECORDARME -->
        <label style="display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);cursor:pointer;margin-bottom:4px">
          <input type="checkbox" name="remember_me" id="remember-me"
                 style="width:15px;height:15px;accent-color:var(--primary);cursor:pointer">
          Recordarme en este equipo
        </label>

        <button type="submit" class="login-submit">
          Iniciar sesión
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
            <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>

      <div class="login-footer">
        Sistema de gestión de inventario
      </div>
    </div>
  </div>

<script>
  var btn = document.getElementById('toggle-pass');
  var inp = document.getElementById('password-input');
  if (btn && inp) {
    btn.addEventListener('click', function() {
      var shown = inp.type === 'text';
      inp.type = shown ? 'password' : 'text';
      btn.setAttribute('aria-label', shown ? 'Mostrar contraseña' : 'Ocultar contraseña');
    });
  }
</script>

</body>
</html>
