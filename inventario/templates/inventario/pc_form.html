{% extends "inventario/base.html" %}
{% block content %}

<div class="row space-between" style="margin-bottom:12px">
  <div>
    <div class="page-title">
      {% if mode == "edit" %}Editar PC{% else %}Nueva PC{% endif %}
    </div>
    <div class="page-subtitle">
      {% if mode == "edit" %}{{ pc.nombre_pc }}{% else %}Completar datos y guardar{% endif %}
    </div>
  </div>

  <div class="page-actions">
    <a class="btn" href="{% url 'pcs_page' %}">← Volver</a>
  </div>
</div>

<div class="card" style="max-width:720px">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="row" style="gap:10px; margin-top:14px">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn" href="{% url 'pcs_page' %}">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
