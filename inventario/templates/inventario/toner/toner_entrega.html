{% extends "inventario/base.html" %}
{% block title %}Registrar entrega{% endblock %}

{% block content %}
<section class="page entrega">
  <div class="panel panel--narrow">
    <header class="page-header">
      <h1 class="page-title">Registrar entrega (Toner)</h1>
      <p class="page-subtitle muted">Crea un EGRESO con detalle de toner.</p>
    </header>

    <form method="post" class="formgrid">
      {% csrf_token %}

      <!-- Fila 1: 4 columnas -->
      <label class="field col-3">
        <span class="label">Servicio</span>
        {{ form.servicio }}
      </label>

      <label class="field col-3">
        <span class="label">Toner</span>
        {{ form.toner }}
      </label>

      <label class="field col-3">
        <span class="label">Cantidad</span>
        {{ form.cantidad }}
      </label>

      <label class="field col-3">
        <span class="label">Fecha (opcional)</span>
        {{ form.fecha }}
      </label>

      <!-- Fila completa -->
      <label class="field col-12">
        <span class="label">Observaciones</span>
        {{ form.observaciones }}
      </label>

      <!-- Acciones -->
      <div class="form-actions col-12">
        <button class="btn primary" type="submit">Guardar entrega</button>
        <a class="btn" href="{% url 'toner_page' %}">Cancelar</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
