{% extends "inventario/base.html" %}
{% block content %}

<div class="card" style="max-width:720px">
  <div class="page-title">Nuevo préstamo de proyector</div>
  <div class="page-subtitle" style="margin-bottom:12px">Registrar retiro y accesorios</div>

  <form method="post" class="grid" style="grid-template-columns:1fr 1fr">
    {% csrf_token %}

    <div>
      <label class="muted">Servicio</label>
      {{ form.servicio }}
    </div>

    <div>
      <label class="muted">Teléfono contacto</label>
      {{ form.telefono_contacto }}
    </div>

    <div>
      <label class="muted">Fecha retiro</label>
      {{ form.fecha_retiro }}
    </div>

    <div>
      <label class="muted">Devolución estimada</label>
      {{ form.fecha_devolucion_estimada }}
    </div>

    <div style="grid-column:1 / -1">
      <label class="muted">Incluye</label>
      <div class="row" style="flex-wrap:wrap; gap:12px; margin-top:6px">
        <label class="row" style="gap:8px">{{ form.incluye_prolongacion }} <span>Prolongación</span></label>
        <label class="row" style="gap:8px">{{ form.incluye_pc }} <span>PC</span></label>
        <label class="row" style="gap:8px">{{ form.incluye_notebook }} <span>Notebook</span></label>
      </div>
    </div>

    <div style="grid-column:1 / -1">
      <label class="muted">Observaciones</label>
      {{ form.observaciones }}
    </div>

    <div class="row" style="grid-column:1 / -1; justify-content:flex-end; gap:10px; margin-top:8px">
      <a class="btn2" href="{% url 'proyector_prestamos_page' %}">Cancelar</a>
      <button class="btn primary" type="submit">Guardar</button>
    </div>
  </form>
</div>

{% endblock %}
