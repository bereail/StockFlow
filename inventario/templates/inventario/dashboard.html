{% extends "inventario/base.html" %}
{% block content %}

<section class="dashboard">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p class="muted">Accesos rápidos</p>
  </div>

  <div class="cards-grid">

    <!-- TONER -->
    <div class="card clickable p-toners" onclick="window.location.href='{% url 'toner_page' %}'">
      <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h12v3H6V3zm-1 5h14a2 2 0 0 1 2 2v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-6a2 2 0 0 1 2-2zm1 2v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6H6z"/>
        </svg>
      </div>

      <div class="card-label">Toners</div>

      <a class="btn2 primary"
         href="{% url 'toner_entrega' %}"
         onclick="event.stopPropagation()"
         style="margin-top:10px">
        + Nueva entrega
      </a>
    </div>

    <!-- PCS (ahora con clase p-pcs) -->
    <a class="card p-pcs" href="{% url 'pcs_page' %}">
      <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 2v9h16V7H4z"/>
        </svg>
      </div>
      <div class="card-label">PCs</div>
    </a>

    <!-- ARTICULOS (ahora con clase p-articulos) -->
    <a class="card p-articulos" href="{% url 'articulos_page' %}">
      <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 3 6.5V17.5L12 22l9-4.5V6.5L12 2zm0 2.2L18.7 7 12 10.4 5.3 7 12 4.2zM5 9l6 3v7.6l-6-3V9zm14 0v7.6l-6 3V12l6-3z"/>
        </svg>
      </div>
      <div class="card-label">Artículos</div>
    </a>

    <!-- SERVICIOS (ahora con clase p-servicios) -->
    <a class="card p-servicios" href="{% url 'servicios_page' %}">
      <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 3.5a7.9 7.9 0 0 0-.2-1.8l2-1.6-2-3.4-2.4 1a8.2 8.2 0 0 0-3.1-1.8l-.4-2.6h-4l-.4 2.6a8.2 8.2 0 0 0-3.1 1.8l-2.4-1-2 3.4 2 1.6A7.9 7.9 0 0 0 3 12c0 .6.1 1.2.2 1.8l-2 1.6 2 3.4 2.4-1a8.2 8.2 0 0 0 3.1 1.8l.4 2.6h4l.4-2.6a8.2 8.2 0 0 0 3.1-1.8l2.4 1 2-3.4-2-1.6c.1-.6.2-1.2.2-1.8z"/>
        </svg>
      </div>
      <div class="card-label">Servicios</div>
    </a>

  </div>
</section>

{% endblock %}
