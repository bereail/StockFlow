{% extends "inventario/base.html" %}
{% block content %}

<section class="dashboard">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p class="muted">Accesos rápidos</p>
  </div>

  <div class="cards-grid">


<!-- TONER -->
<div class="card clickable" onclick="window.location.href='{% url 'toner_page' %}'">
  <div class="icon">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 3h12v3H6V3zm-1 5h14a2 2 0 0 1 2 2v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-6a2 2 0 0 1 2-2zm1 2v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6H6z"/>
    </svg>
  </div>

  <div class="card-label">Toners</div>

  <a
    class="btn2 primary"
    href="{% url 'toner_entrega' %}"
    onclick="event.stopPropagation()"
    style="margin-top:10px"
  >
    + Nueva entrega
  </a>
</div>

        <!-- PCS -->
    <a class="card" href="{% url 'pcs_page' %}">
      <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>
        </svg>
      </div>
      <div class="card-label">PCs</div>
    </a>

    <!-- ARTICULOS -->
    <a class="card" href="{% url 'articulos_page' %}">
      <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 3 6.5V17.5L12 22l9-4.5V6.5L12 2zm0 2.2L18.7 7 12 10.4 5.3 7 12 4.2zM5 9l6 3v7.6l-6-3V9zm14 0v7.6l-6 3V12l6-3z"/>
        </svg>
      </div>
      <div class="card-label">Artículos</div>
    </a>

    <!-- SERVICIOS (página principal, igual a toner_page) -->
    <a class="card" href="{% url 'servicios_page' %}">
      <div class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 2v8h16V7H4z"/>
        </svg>
      </div>
      <div class="card-label">Servicios</div>
    </a>

            <!-- IMPRESORAS -->
<a class="card" href="{% url 'impresoras_page' %}">
  <div class="icon">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 3h10v4H7V3z"/>
      <path d="M5 8h14a2 2 0 0 1 2 2v5a3 3 0 0 1-3 3h-1v-3H7v3H6a3 3 0 0 1-3-3v-5a2 2 0 0 1 2-2z"/>
      <path d="M8 14h8v7H8v-7z"/>
    </svg>
  </div>
  <div class="card-label">Impresoras</div>
</a>

  </div>
</section>


{% endblock %}
