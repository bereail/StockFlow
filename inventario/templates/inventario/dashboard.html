{% extends "inventario/base.html" %}
{% block title %}Registrar Movimiento{% endblock %}

{% block content %}
<section class="hero">
  <h1 class="hero-title">Registrar Movimiento</h1>
  <p class="hero-sub">Gestión rápida de movimientos de inventario</p>

  <div class="cards">
    <a class="card" href="{% url 'toner_page' %}">
      <div class="icon">
        <!-- icon toner -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 7h12v10H6zM5 5h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>
          <path d="M7 9h10v2H7zm0 4h10v2H7z"/>
        </svg>
      </div>
      <div class="card-label">Entregar Tóner</div>
    </a>

    <a class="card" href="{% url 'articulos_page' %}">
      <div class="icon">
        <!-- icon box -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2 3 6.5V17.5L12 22l9-4.5V6.5L12 2zm0 2.2L18.7 7 12 10.4 5.3 7 12 4.2zM5 9l6 3v7.6l-6-3V9zm14 0v7.6l-6 3V12l6-3z"/>
        </svg>
      </div>
      <div class="card-label">Entregar Artículo</div>
    </a>

    <a class="card" href="{% url 'servicios_page' %}">
      <div class="icon">
        <!-- icon pc -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 2v8h16V7H4z"/>
        </svg>
      </div>
      <div class="card-label">Registrar Servicio</div>
    </a>
  </div>
</section>
{% endblock %}
