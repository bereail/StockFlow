{% extends "inventario/base.html" %}
{% block content %}

<div class="row space-between" style="margin-bottom:12px">
  <div>
    <div class="page-title">Entrega rápida</div>
    <div class="page-subtitle">Egreso de Artículos</div>
  </div>

  <div class="row" style="gap:10px">
    <a class="btn2" href="{% url 'articulos_page' %}"><span class="mi">arrow_back</span> Volver</a>
  </div>
</div>

<div class="card">
  <form method="post">
    {% csrf_token %}

    <div class="formgrid">
      <div class="field">
        <div class="label">Servicio</div>
        {{ form.servicio }}
      </div>

      <div class="field">
        <div class="label">Artículo</div>
        {{ form.articulo }}
      </div>

      <div class="field">
        <div class="label">Cantidad</div>
        {{ form.cantidad }}
      </div>

      <div class="field">
        <div class="label">Fecha</div>
        {{ form.fecha }}
      </div>

      <div class="field" style="grid-column: 1 / -1;">
        <div class="label">Observaciones</div>
        {{ form.observaciones }}
      </div>
    </div>

    <div class="row" style="gap:10px; margin-top:14px;">
      <button class="btn primary" type="submit"><span class="mi">save</span> Registrar</button>
      <a class="btn2" href="{% url 'articulos_page' %}">Cancelar</a>
    </div>

  </form>
</div>

{% endblock %}
