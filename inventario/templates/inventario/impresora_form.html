{% extends "inventario/base.html" %}
{% block content %}

<div class="row space-between" style="margin-bottom:12px">
  <div>
    <div class="page-title">
      {% if mode == "edit" %}Editar impresora{% else %}Nueva impresora{% endif %}
    </div>
    <div class="page-subtitle">Completar datos y guardar</div>
  </div>

  <div class="page-actions">
    <a class="btn" href="{% url 'impresoras_page' %}">← Volver</a>
  </div>
</div>

<div class="card" style="max-width:820px">
  <form method="post">
    {% csrf_token %}

    {% if form.non_field_errors %}
      <div class="muted" style="margin-bottom:10px">
        {{ form.non_field_errors }}
      </div>
    {% endif %}

    {{ form.as_p }}

    <div class="row" style="gap:10px; margin-top:10px">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn" href="{% url 'impresoras_page' %}">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
