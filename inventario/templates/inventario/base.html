{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}StockToner{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'inventario/ui.css' %}?v=999">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap">
</head>

<body class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'dashboard' %}">Registro</a>

      <nav class="nav">
        {% with name=request.resolver_match.url_name %}
          <a class="navlink {% if name == 'toner_page' %}active{% endif %}" href="{% url 'toner_page' %}">Toner</a>
          <a class="navlink {% if name == 'pcs_page' %}active{% endif %}" href="{% url 'pcs_page' %}">PC</a>
          <a class="navlink {% if name == 'articulos_page' %}active{% endif %}" href="{% url 'articulos_page' %}">Artículos</a>
          <a class="navlink {% if name == 'impresoras_page' %}active{% endif %}" href="{% url 'impresoras_page' %}">Impresoras</a>
          <a class="navlink {% if name == 'servicios_page' or name == 'servicio_create' or name == 'servicio_edit' %}active{% endif %}"
   href="{% url 'servicios_page' %}">Servicios</a>

        {% endwith %}
        <div class="nav-more">
  <button class="navlink" type="button">Más ▾</button>
  <div class="nav-more-menu">
    <a class="navlink" href="{% url 'proyector_prestamos_page' %}">Proyector</a>
    <a class="btn" href="{% url 'pendientes_page' %}">Pendientes</a>
    <a class="btn" href="{% url 'reparaciones_list' %}">Reparaciones</a>
  </div>
</div>

      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
