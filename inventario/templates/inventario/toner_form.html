{% extends "inventario/base.html" %}
{% block title %}{% if mode == "create" %}Agregar toner{% else %}Editar toner{% endif %}{% endblock %}

{% block content %}
<div class="panel" style="max-width:820px;margin:0 auto;">
  <h2 style="margin:0 0 10px">{% if mode == "create" %}Agregar toner{% else %}Editar toner{% endif %}</h2>

  <form method="post" class="formgrid">
    {% csrf_token %}

    <label class="field">
      <span class="label">Nombre</span>
      {{ form.nombre }}
    </label>

    <label class="field">
      <span class="label">Marca</span>
      {{ form.marca }}
    </label>

    <label class="field">
      <span class="label">Modelo impresora</span>
      {{ form.modelo_impresora }}
    </label>

    <label class="field">
      <span class="label">Activo</span>
      {{ form.activo }}
    </label>

    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn" href="{% url 'toner_page' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
