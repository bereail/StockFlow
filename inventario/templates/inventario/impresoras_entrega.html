{% extends "inventario/base.html" %}
{% block content %}

<div class="row space-between" style="margin-bottom:12px">
  <div>
    <div class="page-title">Registrar movimiento (Impresora)</div>
    <div class="page-subtitle">Asigna / registra EGRESO a un servicio</div>
  </div>

  <div class="page-actions">
    <a class="btn" href="{% url 'impresoras_page' %}">← Volver</a>
  </div>
</div>

<div class="card" style="max-width:820px">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="row" style="gap:10px; margin-top:10px">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn" href="{% url 'impresoras_page' %}">Cancelar</a>
    </div>
  </form>
</div>

{% endblock %}
